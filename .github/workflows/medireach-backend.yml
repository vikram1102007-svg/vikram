name: MediReach backend tests
on:
  push:
    paths:
      - "MediReach/**"
      - ".github/workflows/medireach-backend.yml"
  pull_request:
    paths:
      - "MediReach/**"
      - ".github/workflows/medireach-backend.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MediReach/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: MediReach/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests migrations
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - name: Run MediReach frontend regression tests
        run: node --test ../tests/*.test.cjs
      - name: Build backend image without publishing
        run: docker build --tag medireach-api:ci .
      - name: Verify image runs as non-root
        run: |
          image_user="$(docker image inspect medireach-api:ci --format '{{.Config.User}}')"
          test "$image_user" = "app"
      - name: Verify packaged migration metadata and facility-key CLI
        run: |
          docker run --rm medireach-api:ci alembic heads
          docker run --rm medireach-api:ci python -m app.issue_facility_key --help

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: medireach_ci
          POSTGRES_USER: medireach
          POSTGRES_PASSWORD: medireach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medireach -d medireach_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: MediReach/backend
    env:
      DATABASE_URL: postgresql://medireach:medireach@localhost:5432/medireach_ci
      TEST_DATABASE_URL: postgresql://medireach:medireach@localhost:5432/medireach_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: MediReach/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q tests/test_postgres_concurrency.py
