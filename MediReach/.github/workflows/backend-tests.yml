name: MediReach backend tests
on:
  push:
    paths: ["MediReach/backend/**", "MediReach/.github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["MediReach/backend/**", "MediReach/.github/workflows/backend-tests.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MediReach/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: MediReach/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: pytest -q